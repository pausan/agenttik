name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-budget:
    name: One-second UI startup budget
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: go build -o bin/agenttik-web ./app/cmd/agenttik
      - run: npm ci --prefix e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: make test-startup

  release-tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      is_release: ${{ steps.tag.outputs.is_release }}
    steps:
      # A release tag is vMAJOR.MINOR.PATCH, optionally carrying a suffix of
      # letters, dashes and further dots. The full tag names the assets and the
      # release; only the MAJOR.MINOR.PATCH part goes into the binary, so
      # `agenttik --version` always reports a bare X.Y.Z.
      - id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" && "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)[-.A-Za-z0-9]*$ ]]; then
            printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
            printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo 'is_release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_release=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release-tag
    name: ${{ matrix.platform }} ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            goarch: amd64
            runner: ubuntu-24.04
            cgo_enabled: 1
            build_tags: desktop production webkit2_41
            ldflags: ""
            cgo_ldflags: ""
            extension: ""
          - platform: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            cgo_enabled: 1
            build_tags: desktop production webkit2_41
            ldflags: ""
            cgo_ldflags: ""
            extension: ""
          - platform: darwin
            goarch: arm64
            runner: macos-15
            cgo_enabled: 1
            build_tags: desktop production
            ldflags: ""
            cgo_ldflags: -framework UniformTypeIdentifiers
            extension: ""
          - platform: windows
            goarch: amd64
            runner: windows-2025
            cgo_enabled: 0
            build_tags: desktop production
            ldflags: -H=windowsgui
            cgo_ldflags: ""
            extension: .exe
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build embedded UI
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Build desktop binary
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ needs.release-tag.outputs.tag }}
          VERSION: ${{ needs.release-tag.outputs.version }}
        run: |
          mkdir -p dist
          # An untagged push has no version to report, so it says which commit
          # it is instead, in the file name and in the binary alike.
          ldflags="-X main.version=${VERSION:-${GITHUB_SHA::12}}"
          if [[ -n "${{ matrix.ldflags }}" ]]; then
            ldflags="${{ matrix.ldflags }} $ldflags"
          fi
          if [[ -n "${{ matrix.cgo_ldflags }}" ]]; then
            export CGO_LDFLAGS="${{ matrix.cgo_ldflags }}"
          fi
          go build \
            -trimpath \
            -tags "${{ matrix.build_tags }}" \
            -ldflags "$ldflags" \
            -o "dist/agenttik_${TAG:-${GITHUB_SHA::12}}_${GOOS}_${GOARCH}${{ matrix.extension }}" \
            ./app/cmd/agenttik

      - name: Upload release asset
        if: needs.release-tag.outputs.is_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agenttik-release-${{ matrix.platform }}-${{ matrix.goarch }}
          path: dist/agenttik_*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [release-tag, build, startup-budget]
    if: needs.release-tag.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: agenttik-release-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-tag.outputs.tag }}
        run: gh release create "$TAG" release/* --title "$TAG" --generate-notes
