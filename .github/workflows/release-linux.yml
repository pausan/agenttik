name: Build Linux binaries

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      asset_version: ${{ steps.tag.outputs.asset_version }}
      is_release: ${{ steps.tag.outputs.is_release }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          asset_version=$(printf '%s' "$TAG" | tr -c '[:alnum:]._-+' '-')
          printf 'version=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'asset_version=%s\n' "$asset_version" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo 'is_release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_release=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    name: Linux ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build embedded UI
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Build binary
        env:
          ASSET_VERSION: ${{ needs.tag.outputs.asset_version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          webkit_tag=$(pkg-config --exists webkit2gtk-4.1 && echo webkit2_41)
          go build -trimpath -tags "desktop production $webkit_tag" \
            -o "dist/agenttik_${ASSET_VERSION}_linux_${GOARCH}" ./app/cmd/agenttik

      - name: Upload private build artifact
        if: needs.tag.outputs.is_release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agenttik-linux-${{ matrix.goarch }}
          path: dist/agenttik_*
          if-no-files-found: error
          retention-days: 14

      - name: Upload release asset
        if: needs.tag.outputs.is_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agenttik-release-linux-${{ matrix.goarch }}
          path: dist/agenttik_*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [tag, build]
    if: needs.tag.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: agenttik-release-linux-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.version }}
        run: gh release create "$TAG" release/* --title "$TAG" --generate-notes
