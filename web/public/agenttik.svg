<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="i11v2-t i11v2-d">
  <title id="i11v2-t">agenttik icon</title>
  <desc id="i11v2-d">A large AI sparkle with a smaller spark, raised with layered shadows and an ambient green glow on a dark plate.</desc>
  <defs>
    <linearGradient id="i11v2-plate" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c2c34"/><stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <radialGradient id="i11v2-spot" cx="30" cy="22" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00dc82" stop-opacity=".20"/><stop offset="1" stop-color="#00dc82" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i11v2-mark" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7df9c2"/><stop offset=".5" stop-color="#00dc82"/><stop offset="1" stop-color="#009a59"/>
    </linearGradient>
    <linearGradient id="i11v2-alt" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c3e6d5"/>
    </linearGradient>
    <radialGradient id="i11v2-node" cx=".34" cy=".28" r=".92">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a5cab7"/>
    </radialGradient>
    <linearGradient id="i11v2-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/><stop offset=".62" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="i11v2-lift" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="gb"/>
      <feFlood flood-color="#00dc82" flood-opacity=".40"/>
      <feComposite in2="gb" operator="in" result="glow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feOffset dy="2.6" result="sb"/>
      <feFlood flood-color="#000000" flood-opacity=".55"/>
      <feComposite in2="sb" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#i11v2-plate)"/>
  <rect width="64" height="64" rx="16" fill="url(#i11v2-spot)"/>
  <g filter="url(#i11v2-lift)">
    <path d="M32 11 36.8 27.2 53 32 36.8 36.8 32 53 27.2 36.8 11 32 27.2 27.2Z" fill="url(#i11v2-mark)"/>
  </g>
  <path d="M32 11 36.8 27.2 53 32 36.8 36.8 32 53 27.2 36.8 11 32 27.2 27.2Z" fill="url(#i11v2-gloss)"/>
  <g filter="url(#i11v2-lift)">
    <path d="M18.5 13.5 21.3 23.2 31 26 21.3 28.8 18.5 38.5 15.7 28.8 6 26 15.7 23.2Z" fill="url(#i11v2-alt)"/>
  </g>
  <path d="M18.5 13.5 21.3 23.2 31 26 21.3 28.8 18.5 38.5 15.7 28.8 6 26 15.7 23.2Z" fill="url(#i11v2-gloss)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
</svg>
