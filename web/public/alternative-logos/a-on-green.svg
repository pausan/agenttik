<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="i3v4-t i3v4-d">
  <title id="i3v4-t">agenttik icon</title>
  <desc id="i3v4-d">A solid letter A with a crossbar, embossed in deep emerald with a soft cast shadow on a light mint plate.</desc>
  <defs>
    <linearGradient id="i3v4-plate" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3eee0"/>
    </linearGradient>
    <radialGradient id="i3v4-spot" cx="32" cy="19" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00dc82" stop-opacity=".16"/><stop offset="1" stop-color="#00dc82" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i3v4-mark" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16c98c"/><stop offset=".5" stop-color="#059669"/><stop offset="1" stop-color="#045c46"/>
    </linearGradient>
    <linearGradient id="i3v4-alt" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4c39"/><stop offset="1" stop-color="#05221a"/>
    </linearGradient>
    <radialGradient id="i3v4-node" cx=".34" cy=".28" r=".92">
      <stop offset="0" stop-color="#3c6b57"/><stop offset="1" stop-color="#082019"/>
    </radialGradient>
    <linearGradient id="i3v4-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".42"/><stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="i3v4-lift" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="3"/>
      <feFlood flood-color="#0a5f42" flood-opacity=".22"/>
      <feComposite in2="SourceAlpha" operator="in" result="x"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.6"/>
      <feOffset dy="3.4" result="s1"/>
      <feFlood flood-color="#0a5f42" flood-opacity=".20"/>
      <feComposite in2="s1" operator="in" result="ambient"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.3"/>
      <feOffset dy="1.4" result="s2"/>
      <feFlood flood-color="#08402e" flood-opacity=".34"/>
      <feComposite in2="s2" operator="in" result="contact"/>
      <feMerge><feMergeNode in="ambient"/><feMergeNode in="contact"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#i3v4-plate)"/>
  <rect width="64" height="64" rx="16" fill="url(#i3v4-spot)"/>
  <g filter="url(#i3v4-lift)">
    <path d="M32 13.5 50 50.5 40.6 50.5 32 26 23.4 50.5 14 50.5Z" fill="url(#i3v4-alt)" stroke="url(#i3v4-alt)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M32 13.5 50 50.5 40.6 50.5 32 26 23.4 50.5 14 50.5Z" fill="url(#i3v4-gloss)"/>
  <g filter="url(#i3v4-lift)">
    <rect x="19" y="34.2" width="26" height="6" rx="3" fill="url(#i3v4-mark)"/>
  </g>
  <rect x="20.4" y="35.15" width="23.2" height="1.8" rx=".9" fill="url(#i3v4-gloss)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#0b7a54" stroke-opacity=".20"/>
</svg>
