<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="i17v2-t i17v2-d">
  <title id="i17v2-t">agenttik icon</title>
  <desc id="i17v2-d">A working arc around an AI sparkle, raised with layered shadows and an ambient green glow on a dark plate.</desc>
  <defs>
    <linearGradient id="i17v2-plate" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c2c34"/><stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <radialGradient id="i17v2-spot" cx="30" cy="22" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00dc82" stop-opacity=".20"/><stop offset="1" stop-color="#00dc82" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i17v2-mark" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7df9c2"/><stop offset=".5" stop-color="#00dc82"/><stop offset="1" stop-color="#009a59"/>
    </linearGradient>
    <linearGradient id="i17v2-alt" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c3e6d5"/>
    </linearGradient>
    <radialGradient id="i17v2-node" cx=".34" cy=".28" r=".92">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a5cab7"/>
    </radialGradient>
    <linearGradient id="i17v2-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/><stop offset=".62" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="i17v2-lift" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="gb"/>
      <feFlood flood-color="#00dc82" flood-opacity=".40"/>
      <feComposite in2="gb" operator="in" result="glow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feOffset dy="2.6" result="sb"/>
      <feFlood flood-color="#000000" flood-opacity=".55"/>
      <feComposite in2="sb" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#i17v2-plate)"/>
  <rect width="64" height="64" rx="16" fill="url(#i17v2-spot)"/>
  <g filter="url(#i17v2-lift)">
    <path d="M32 13A19 19 0 1 1 13 32" fill="none" stroke="url(#i17v2-mark)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="32" cy="13" r="3.4" fill="url(#i17v2-node)"/>
    <path d="M32 18.5 36 28 45.5 32 36 36 32 45.5 28 36 18.5 32 28 28Z" fill="url(#i17v2-alt)"/>
  </g>
  <path d="M32 13A19 19 0 1 1 13 32" fill="none" stroke="url(#i17v2-gloss)" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M32 18.5 36 28 45.5 32 36 36 32 45.5 28 36 18.5 32 28 28Z" fill="url(#i17v2-gloss)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
</svg>
