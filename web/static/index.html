<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agenttik</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300dc82'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<aside id="sidebar">
  <header class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">agenttik</span>
  </header>

  <div class="tabs" id="side-tabs">
    <button class="tab active" data-pane="projects">Projects</button>
    <button class="tab" data-pane="sessions">Sessions</button>
  </div>

  <section class="pane active" id="pane-projects">
    <div class="pane-head">
      <button id="add-project" class="btn btn-soft" style="flex:1 1 auto">+ Add project</button>
    </div>
    <div class="scroll" id="project-list"></div>
  </section>

  <section class="pane" id="pane-sessions">
    <div class="pane-head">
      <input id="session-filter" class="input" type="search" placeholder="Filter sessions">
    </div>
    <div class="pane-head">
      <select id="session-window" class="select" style="flex:1 1 auto">
        <option value="1d">Last day</option>
        <option value="3d" selected>Last 3 days</option>
        <option value="7d">Last week</option>
        <option value="1mo">Last month</option>
        <option value="all">All</option>
      </select>
    </div>
    <div class="scroll" id="session-list"></div>
  </section>
</aside>

<main id="main">
  <div class="main-head">
    <div class="tabs-underline" id="main-tabs"></div>
    <div id="session-meta"></div>
  </div>
  <div id="main-body"></div>
  <form id="prompt-bar" autocomplete="off">
    <div class="prompt-box">
      <textarea id="prompt" rows="3" placeholder="Ask the agent…"></textarea>
      <div class="prompt-controls">
        <select id="model-select" class="select" title="Model"></select>
        <select id="effort-select" class="select" title="Effort"></select>
        <button type="button" id="star-btn" class="btn btn-ghost btn-icon" title="Star this model and effort">☆</button>
        <span class="spacer"></span>
        <span id="turn-state"></span>
        <button type="button" id="stop-btn" class="btn btn-outline" hidden>Stop</button>
        <button type="submit" id="send-btn" class="btn">Send</button>
      </div>
    </div>
    <p class="hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a newline</p>
  </form>
</main>

<aside id="inspector">
  <div class="tabs" id="inspector-tabs" style="margin-top:12px">
    <button class="tab active" data-pane="stats">Stats</button>
    <button class="tab" data-pane="changed">Changed</button>
    <button class="tab" data-pane="tree">Tree</button>
  </div>
  <div class="scroll pane active" id="pane-stats"></div>
  <div class="scroll pane" id="pane-changed"></div>
  <div class="scroll pane" id="pane-tree"></div>
</aside>

<dialog id="new-project">
  <form method="dialog">
    <h3>Add project</h3>
    <div class="fields">
      <label>Folder <input name="path" class="input" placeholder="~/code/myproject" required></label>
      <label>Name <input name="name" class="input" placeholder="defaults to the folder name"></label>
    </div>
    <menu>
      <button value="cancel" class="btn btn-ghost">Cancel</button>
      <button value="ok" id="new-project-ok" class="btn">Add</button>
    </menu>
  </form>
</dialog>

<dialog id="new-session">
  <form method="dialog">
    <h3>New session</h3>
    <div class="fields">
      <label>Provider <select name="provider" class="select"></select></label>
      <label>Model <select name="model" class="select"></select></label>
      <label>Effort <select name="effort" class="select"></select></label>
      <label>Permission
        <select name="permission" class="select">
          <option value="workspace" selected>Edit inside the project</option>
          <option value="plan">Read only</option>
          <option value="full">No guardrails</option>
        </select>
      </label>
    </div>
    <menu>
      <button value="cancel" class="btn btn-ghost">Cancel</button>
      <button value="ok" class="btn">Start</button>
    </menu>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
